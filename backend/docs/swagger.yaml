basePath: /
definitions:
  dbms-project_internal_db.GetProgramByIDRow:
    properties:
      deadline:
        type: string
      location:
        $ref: '#/definitions/sql.NullString'
      p_name:
        type: string
      p_unit:
        $ref: '#/definitions/sql.NullString'
      prev_cutmarks:
        $ref: '#/definitions/sql.NullString'
      program_id:
        type: integer
      total_seats:
        type: integer
      u_id:
        type: integer
      university_name:
        type: string
      website:
        type: string
    type: object
  dbms-project_internal_db.ListProgramsRow:
    properties:
      deadline:
        type: string
      p_name:
        type: string
      p_unit:
        $ref: '#/definitions/sql.NullString'
      prev_cutmarks:
        $ref: '#/definitions/sql.NullString'
      program_id:
        type: integer
      total_seats:
        type: integer
      u_id:
        type: integer
      university_location:
        $ref: '#/definitions/sql.NullString'
      university_name:
        type: string
    type: object
  internal_handler_rest.ApplyRequest:
    properties:
      program_id:
        type: integer
    type: object
  internal_handler_rest.EligibleProgram:
    properties:
      program_id:
        type: integer
      program_name:
        type: string
      university_name:
        type: string
    type: object
  internal_handler_rest.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  internal_handler_rest.ProgramRequirementsResponse:
    properties:
      is_ready_to_apply:
        type: boolean
      missing_fields:
        items:
          type: string
        type: array
      program_id:
        type: integer
      required_fields:
        items:
          $ref: '#/definitions/internal_handler_rest.RequiredFieldStatus'
        type: array
    type: object
  internal_handler_rest.RegisterRequest:
    properties:
      dob:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
    type: object
  internal_handler_rest.RequiredFieldStatus:
    properties:
      field_name:
        type: string
      is_provided:
        type: boolean
      value:
        description: Null if not filled yet
        type: string
    type: object
  sql.NullString:
    properties:
      string:
        type: string
      valid:
        description: Valid is true if String is not NULL
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: API Server for University Student Admission System
  title: DBMS Project API
  version: "1.0"
paths:
  /applications/apply:
    post:
      consumes:
      - application/json
      description: Submits a program application for the authenticated student. Checks
        for missing required profile fields before creation.
      parameters:
      - description: Program Application Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.ApplyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Application submitted successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload or incomplete profile with missing
            fields
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to submit application or error fetching requirements
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Apply to an academic program
      tags:
      - Applications
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates student credentials (email and password) and returns
        a signed JWT authentication token.
      parameters:
      - description: Student Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful with token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload
          schema:
            type: string
        "401":
          description: Invalid email or password
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Login a student
      tags:
      - Auth
  /profile:
    get:
      description: Returns confirmation and student ID for the currently authenticated
        student.
      produces:
      - application/json
      responses:
        "200":
          description: Access granted to protected profile
          schema:
            additionalProperties: true
            type: object
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Could not retrieve user identity
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get authenticated profile status
      tags:
      - Profile
  /program/requirements:
    get:
      description: Checks if the authenticated student has fulfilled all required
        profile fields for a specific program.
      parameters:
      - description: Program ID
        in: query
        name: program_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Requirements status response
          schema:
            $ref: '#/definitions/internal_handler_rest.ProgramRequirementsResponse'
        "400":
          description: Invalid program_id
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to fetch requirements
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get program requirements status
      tags:
      - Requirements
  /programs:
    get:
      description: Retrieves a list of available academic programs with optional search
        keywords and unit filter.
      parameters:
      - description: Search query for program name or details
        in: query
        name: search
        type: string
      - description: Filter by program unit (e.g. A, B)
        in: query
        name: unit
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of programs
          schema:
            items:
              $ref: '#/definitions/dbms-project_internal_db.ListProgramsRow'
            type: array
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to fetch programs
          schema:
            type: string
      summary: List programs
      tags:
      - Programs
  /programs/detail:
    get:
      description: Retrieves detailed program information for a given program ID parameter.
      parameters:
      - description: Program ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Program detail
          schema:
            $ref: '#/definitions/dbms-project_internal_db.GetProgramByIDRow'
        "400":
          description: Missing or invalid program id
          schema:
            type: string
        "404":
          description: Program not found
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get program details by ID
      tags:
      - Programs
  /programs/eligible:
    get:
      description: Evaluates authenticated student's academic performance (GPA, HSC
        group, subject marks) against program admission requirements.
      produces:
      - application/json
      responses:
        "200":
          description: List of eligible programs
          schema:
            items:
              $ref: '#/definitions/internal_handler_rest.EligibleProgram'
            type: array
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "500":
          description: Failed to fetch student academics, subject marks, or programs
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List eligible programs for authenticated student
      tags:
      - Applications
  /register:
    post:
      consumes:
      - application/json
      description: Register a new student account with first name, last name, email,
        password, and date of birth (YYYY-MM-DD).
      parameters:
      - description: Student Registration Information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_rest.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Registration successful
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload or date format
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
        "409":
          description: Failed to create account (email might already exist)
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Register a new student
      tags:
      - Auth
  /student/profile:
    post:
      consumes:
      - application/json
      description: Upserts dynamic key-value profile fields for the authenticated
        student.
      parameters:
      - description: 'Profile fields key-value dictionary (e.g. {''PRESENT_ADDRESS'':
          ''Dhaka''})'
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request payload or failed field update
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update student profile fields
      tags:
      - Profile
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by your JWT token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
