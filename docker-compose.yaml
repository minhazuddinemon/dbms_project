services:
  db:
    image: mariadb:10.11
    container_name: admission_db
    restart: always
    environment:
      MARIADB_USER: admission_user
      MARIADB_PASSWORD: secretpassword
      MARIADB_ROOT_PASSWORD: rootsecret
      MARIADB_DATABASE: admission_db
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    # Ensures MariaDB is fully initialized before backend tries to connect
    healthcheck:
      # Fixed typo: healthcheck.sh (dot instead of hyphen)
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admission_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=jwtsecret
      - ADMIN_EMAIL=admin@gmail.com
      - ADMIN_PASSWORD=12345678
      - DB_DSN=admission_user:secretpassword@tcp(db:3306)/admission_db?parseTime=true&multiStatements=true
    depends_on:
      db:
        condition: service_healthy

