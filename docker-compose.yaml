services:
  db:
    image: mariadb:10.11
    container_name: admission_db
    restart: always
    environment:
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    # Ensures MariaDB is fully initialized before backend tries to connect
    healthcheck:
      test: ["CMD", "healthcheck-sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admission_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_DSN=${DB_DSN}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admission_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ORIGIN=http://localhost:3000
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  mariadb_data:
